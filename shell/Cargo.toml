[package]
name = "lamp-shell"
version = "0.1.0"
edition = "2021"
description = "Lamp shell — DriftWM compositor wrapper + Fruiger Aero bar"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-client = "0.31"
wayland-protocols = "0.32"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }