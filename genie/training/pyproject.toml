[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genie-training"
version = "0.1.0"
description = "Training stack for Genie: 1-bit multimodal liquid diffusion LLM"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy",
    "pyyaml",
    "tokenizers",
    "safetensors",
    "tqdm",
]

[tool.setuptools]
packages = ["genie_model"]
